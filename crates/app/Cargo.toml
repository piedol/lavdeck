[package]
name = "lavdeck-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Lavdeck's AppKit interface: the deck, the menu bar icon, Recordings and Settings"

[[bin]]
name = "Lavdeck"
path = "src/main.rs"

[dependencies]
lavdeck-kit.workspace = true
lavdeck-capture.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-core-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-quartz-core.workspace = true
objc2-core-graphics.workspace = true
objc2-core-media.workspace = true
objc2-av-foundation = { workspace = true, features = ["objc2-core-video"] }
objc2-service-management.workspace = true
block2.workspace = true
dispatch2.workspace = true
objc2-av-kit = { version = "0.3.2", features = ["block2", "objc2-core-media", "objc2-core-foundation"] }
objc2-core-video = "0.3.2"
