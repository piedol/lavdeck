[workspace]
members = ["crates/kit", "crates/capture", "crates/app", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
lavdeck-kit = { path = "crates/kit" }
lavdeck-capture = { path = "crates/capture" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-media = "0.3.2"
objc2-av-foundation = { version = "0.3.2", features = ["block2", "objc2-core-media", "objc2-core-graphics", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-screen-capture-kit = "0.3.2"
objc2-service-management = "0.3.2"
block2 = "0.6.2"
dispatch2 = "0.3.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
debug = false
